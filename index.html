<section class="ampy-foreefter" aria-labelledby="ampy-foreefter-rubrik-2-2">
	<noscript><style>#ampy-foreefter-1, #ampy-foreefter-2 .ampy-foreefter__ram{position:static;aspect-ratio:auto;display:grid;gap:4px;background:rgba(9,11,50,.09);cursor:auto;touch-action:auto}#ampy-foreefter-1, #ampy-foreefter-2 .ampy-foreefter__ram::after{display:none}#ampy-foreefter-1, #ampy-foreefter-2 .ampy-foreefter__lager{position:relative;inset:auto}#ampy-foreefter-1, #ampy-foreefter-2 .ampy-foreefter__lager>img{height:auto;aspect-ratio:1/1}#ampy-foreefter-1, #ampy-foreefter-2 .ampy-foreefter__lager--fore{clip-path:none;order:-1}#ampy-foreefter-1, #ampy-foreefter-2 .ampy-foreefter__somlinje,#ampy-foreefter-1, #ampy-foreefter-2 .ampy-foreefter__handtag,#ampy-foreefter-1, #ampy-foreefter-2 .ampy-foreefter__ledtrad,#ampy-foreefter-1, #ampy-foreefter-2 .ampy-foreefter__reglage{display:none}</style></noscript>

	<div class="ampy-foreefter__inner">

		<h2 class="ampy-foreefter__rubrik" id="ampy-foreefter-rubrik-2-2">Så ser det ut när vi har <span class="ampy-foreefter__accent">bytt en elcentral</span></h2>

		<div class="ampy-foreefter__par">
			<figure class="ampy-foreefter__figur" id="ampy-foreefter-1" data-ampy-foreefter>
				<div class="ampy-foreefter__ram">

					<!-- EFTER är basskiktet och ligger alltid helt i DOM -->
					<div class="ampy-foreefter__lager ampy-foreefter__lager--efter">
						<img class="ampy-foreefter__bild" src="img/par1-efter.svg" width="1000" height="1000" loading="lazy" decoding="async" draggable="false" sizes="(max-width: 719px) 94vw, 620px" alt="Byte av elcentral — efter, utfört av Ampy">
					</div>

					<!-- FÖRE ligger ovanpå och klipps vid sömmen. Chippet klipps med. -->
					<div class="ampy-foreefter__lager ampy-foreefter__lager--fore">
						<img class="ampy-foreefter__bild" src="img/par1-fore.svg" width="1000" height="1000" loading="lazy" decoding="async" draggable="false" sizes="(max-width: 719px) 94vw, 620px" alt="Byte av elcentral — före">
						<span class="ampy-foreefter__chip ampy-foreefter__chip--fore">Före</span>
					</div>

					<!-- EFTER-chippet klipps spegelvänt: det finns bara till höger om
					     sömmen, precis som FÖRE-chippet bara finns till vänster. Drar
					     man hela vägen åt ena hållet försvinner motsvarande sida helt. -->
					<div class="ampy-foreefter__chiplager">
						<span class="ampy-foreefter__chip ampy-foreefter__chip--efter">Efter</span>
					</div>

					<div class="ampy-foreefter__somlinje" aria-hidden="true"></div>
					<div class="ampy-foreefter__handtag" aria-hidden="true">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M9 6l-6 6 6 6M15 6l6 6-6 6"/></svg>
					</div>
					<p class="ampy-foreefter__ledtrad" aria-hidden="true">Dra för att jämföra</p>
				</div>

				<input class="ampy-foreefter__reglage" type="range" min="0" max="100" step="1" value="35"
				       aria-label="Jämför före och efter: Från proppskåp till ny central med jordfelsbrytare" aria-describedby="ampy-foreefter-1-hjalp"
				       aria-valuetext="Efter syns till 65 procent">
				<p class="ampy-foreefter__sr" id="ampy-foreefter-1-hjalp">Dra reglaget för att jämföra före och efter. Du kan också trycka var som helst i bilden, eller använda piltangenterna.</p>
			</figure>
			<figure class="ampy-foreefter__figur" id="ampy-foreefter-2" data-ampy-foreefter>
				<div class="ampy-foreefter__ram">

					<!-- EFTER är basskiktet och ligger alltid helt i DOM -->
					<div class="ampy-foreefter__lager ampy-foreefter__lager--efter">
						<img class="ampy-foreefter__bild" src="img/par2-efter.svg" width="1000" height="1000" loading="lazy" decoding="async" draggable="false" sizes="(max-width: 719px) 94vw, 620px" alt="Byte av elcentral — efter, utfört av Ampy">
					</div>

					<!-- FÖRE ligger ovanpå och klipps vid sömmen. Chippet klipps med. -->
					<div class="ampy-foreefter__lager ampy-foreefter__lager--fore">
						<img class="ampy-foreefter__bild" src="img/par2-fore.svg" width="1000" height="1000" loading="lazy" decoding="async" draggable="false" sizes="(max-width: 719px) 94vw, 620px" alt="Byte av elcentral — före">
						<span class="ampy-foreefter__chip ampy-foreefter__chip--fore">Före</span>
					</div>

					<!-- EFTER-chippet klipps spegelvänt: det finns bara till höger om
					     sömmen, precis som FÖRE-chippet bara finns till vänster. Drar
					     man hela vägen åt ena hållet försvinner motsvarande sida helt. -->
					<div class="ampy-foreefter__chiplager">
						<span class="ampy-foreefter__chip ampy-foreefter__chip--efter">Efter</span>
					</div>

					<div class="ampy-foreefter__somlinje" aria-hidden="true"></div>
					<div class="ampy-foreefter__handtag" aria-hidden="true">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M9 6l-6 6 6 6M15 6l6 6-6 6"/></svg>
					</div>
					<p class="ampy-foreefter__ledtrad" aria-hidden="true">Dra för att jämföra</p>
				</div>

				<input class="ampy-foreefter__reglage" type="range" min="0" max="100" step="1" value="35"
				       aria-label="Jämför före och efter: Femton grupper samlade i en central med jordfelsbrytare" aria-describedby="ampy-foreefter-2-hjalp"
				       aria-valuetext="Efter syns till 65 procent">
				<p class="ampy-foreefter__sr" id="ampy-foreefter-2-hjalp">Dra reglaget för att jämföra före och efter. Du kan också trycka var som helst i bilden, eller använda piltangenterna.</p>
			</figure>
		</div>
		<p class="ampy-foreefter__tagline">Ny elcentral, jordfelsbrytare och märkta grupper. Samma jobb oavsett hur det såg ut innan.</p>

	</div>
</section>
